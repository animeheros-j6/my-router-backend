<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Link Provisioning Utility</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; max-width: 600px; margin: 40px auto; padding: 20px; }
        h1 { color: #00ff88; text-align: center; font-size: 24px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #333; background: #252525; color: #fff; box-sizing: border-box; }
        button { background: #00ff88; color: #121212; font-weight: bold; cursor: pointer; border: none; font-size: 16px; transition: background 0.2s; }
        button:hover { background: #00cc6e; }
        .download-btn { background: #00bfff; color: #fff; display: none; text-align: center; text-decoration: none; padding: 12px; border-radius: 4px; font-weight: bold; margin-bottom: 20px; box-sizing: border-box; }
        .links-container { display: none; }
        .link-item { background: #2a2a2a; padding: 10px; margin: 5px 0; border-radius: 4px; border-left: 4px solid #00ff88; font-size: 11px; }
        a { color: #00ff88; text-decoration: none; word-break: break-all; }
        a:hover { text-decoration: underline; }
        .status-text { color: #ffb700; font-weight: bold; text-align: center; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <h1>🔗 Dynamic Link Provisioning Utility</h1>
    
    <div class="card">
        <form id="genForm">
            <label for="targetIp">Target Destination Address (IP or Domain):</label>
            <input type="text" id="targetIp" placeholder="e.g., 51.222.141.36" required>

            <label for="linkCount">Quantity of Links to Provision (Up to 10,000):</label>
            <input type="number" id="linkCount" min="1" max="10000" value="10" placeholder="Type a number, e.g., 5000" required>

            <button type="submit" id="submitBtn">Provision Dynamic Links</button>
        </form>
    </div>

    <div id="statusMsg" class="status-text">Processing data layout stream...</div>
    <a id="downloadTxt" class="download-btn" href="#" download="provisioned_links.txt">📥 Download Links (.txt File)</a>

    <div class="card links-container" id="linksContainer">
        <h3>Active Accessible Entryways (Showing first 100 on screen):</h3>
        <div id="linksList"></div>
    </div>

    <script>
        // High-reputation developer, translation, and CDN routing domains.
        // Because these domains host vital web elements, GoGuardian rarely blocks them entirely.
        const RESILIENT_GATEWAYS = [
            "https://google.com",
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?",
            "https://authing.cn",
            "https://googleusercontent.com"
        ];

        // Random query parameters to keep every single generated link unique
        const RANDOM_KEYS = ["session_id", "token", "auth_key", "sec_token", "req_id", "client_state", "build_hash", "uid", "visitor_ctx"];

        function getRandomString(length) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        document.getElementById('genForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const target = document.getElementById('targetIp').value.trim();
            let count = parseInt(document.getElementById('linkCount').value);
            
            if (count > 10000) count = 10000;
            if (count < 1) count = 1;

            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');
            const linksContainer = document.getElementById('linksContainer');
            const linksList = document.getElementById('linksList');
            const downloadBtn = document.getElementById('downloadTxt');

            submitBtn.disabled = true;
            statusMsg.style.display = 'block';
            linksContainer.style.display = 'none';
            downloadBtn.style.display = 'none';
            linksList.innerHTML = '';

            setTimeout(() => {
                let txtContent = `=== PROVISIONED RANDOMIZED DIVERSE GATEWAYS FOR TARGET: ${target} ===\n\n`;
                const cleanDestination = target.startsWith('http') ? target : `https://${target}`;
                const fragment = document.createDocumentFragment();

                for (let i = 0; i < count; i++) {
                    // 1. Fully randomize the gateway selected on every loop cycle iteration
                    const baseGateway = RESILIENT_GATEWAYS[Math.floor(Math.random() * RESILIENT_GATEWAYS.length)];
                    
                    // 2. Mix up variable string components so every link has completely different parameters
                    const key1 = RANDOM_KEYS[Math.floor(Math.random() * RANDOM_KEYS.length)];
                    const key2 = RANDOM_KEYS[Math.floor(Math.random() * RANDOM_KEYS.length)];
                    const val1 = getRandomString(10);
                    const val2 = getRandomString(14);
                    
                    // 3. Assemble the completely unique, obfuscated routing path structure
                    const randomNoise = `&${key1}=${val1}&${key2}=${val2}&cb=${getRandomString(6)}`;
                    const stylizedUrl = `${baseGateway}${encodeURIComponent(cleanDestination)}${randomNoise}`;
                    
                    txtContent += `${i + 1}. ${stylizedUrl}\n`;
                    
                    if (i < 100) {
                        const div = document.createElement('div');
                        div.className = 'link-item';
                        div.innerHTML = `<a href="${stylizedUrl}" target="_blank">${stylizedUrl}</a>`;
                        fragment.appendChild(div);
                    }
                }

                const txtBlob = new Blob([txtContent], { type: 'text/plain' });
                downloadBtn.href = URL.createObjectURL(txtBlob);
                
                linksList.appendChild(fragment);

                submitBtn.disabled = false;
                statusMsg.style.display = 'none';
                downloadBtn.style.display = 'block';
                linksContainer.style.display = 'block';
            }, 50);
        });
    </script>
</body>
</html>
